[workspace]
resolver = "2"
members = [
    "core/pdf",
    "core/pages",
    "core/annotate",
    "core/redact",
    "core/forms",
    "core/ocr",
    "core/office",
    "core/a11y",
    "core/compare",
    "core/edit",
    "core/ai",
    "core/convert",
    "core/exact",
    "core/layout",
    "core/fonts",
    "core/search",
    "app/shell-core",
    "app/shell",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

# dependencies are optimised even in debug builds: png compression and
# similar inner loops are far too slow otherwise, and they rarely need debugging
[profile.dev.package."*"]
opt-level = 2

# fonts: ttf-parser checks some of its own arithmetic with debug
# assertions that hostile font files can trip. release builds have none
# and fall back to bounds-checked reads, so debug builds and tests are
# made to behave the same (see core/fonts/tests/robustness.rs)
[profile.dev.package.ttf-parser]
debug-assertions = false

# small, fast release builds: the app should start quickly and stay light
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
