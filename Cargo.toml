[workspace]
resolver = "2"
members = [
    "core/pdf",
    "core/pages",
    "core/annotate",
    "core/redact",
    "core/forms",
    "core/ocr",
    "core/office",
    "core/a11y",
    "core/compare",
    "core/edit",
    "core/ai",
    "core/convert",
    "core/exact",
    "core/layout",
    "core/fonts",
    "core/search",
    "core/standards",
    "core/sheets",
    "core/slides",
    "app/shell-core",
    "app/shell",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false
# see LICENSE: either license, at the user's option
license = "MIT OR Apache-2.0"

# dependencies are optimised even in debug builds: png compression and
# similar inner loops are far too slow otherwise, and they rarely need debugging
[profile.dev.package."*"]
opt-level = 2

# fonts: completing a document's font (comparing and fitting outlines
# from the whole font library) took 30 s per edit unoptimised in the debug
# app; optimised like the dependencies above it is several times faster
[profile.dev.package.letters-fonts]
opt-level = 2

# fonts: ttf-parser checks some of its own arithmetic with debug
# assertions that hostile font files can trip. release builds have none
# and fall back to bounds-checked reads, so debug builds and tests are
# made to behave the same (see core/fonts/tests/robustness.rs)
[profile.dev.package.ttf-parser]
debug-assertions = false

# the spreadsheet engine reads and calculates hundreds of thousands of
# cells at a time; unoptimised, opening a 200,000-row workbook took 7.1 s
# and inserting a row 4.2 s in the debug app; optimised, 1.7 s and 1.4 s
# (the ignored timing test in app/shell-core/src/sheets/sessions_tests.rs)
[profile.dev.package.letters-sheets]
opt-level = 2

# small, fast release builds: the app should start quickly and stay light.
# thin lto with parallel codegen keeps the final link within the memory of
# github's windows runners (16 GB); full lto with one unit didn't fit
[profile.release]
codegen-units = 16
lto = "thin"
opt-level = 3
panic = "abort"
strip = true

# the exact converter: on windows, llvm's instruction selection fails on
# verify::lattice_floor at opt-level 2 and 3 ("SmallVector unable to grow"
# with the gnu toolchain, out of memory with msvc; rust 1.99), whatever
# shape the loop is given. macos compiles it at 3. opt-level 1 compiles it
# everywhere, and rust's floating point gives the same results at every
# level, so the converter's output is unchanged (the locked exact-bytes
# test passes in release). try 3 again with a newer compiler.
[profile.release.package.letters-exact]
opt-level = 1
