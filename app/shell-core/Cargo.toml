[package]
name = "letters-shell-core"
description = "the parts of the desktop shell that need no window, kept apart so they can be unit tested"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
letters-pdf = { path = "../../core/pdf" }
letters-pages = { path = "../../core/pages" }
# reads and writes pdf structure for edits (mit licence)
lopdf = "0.47"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# word-processor mode: reads and writes .docx and .odt (see src/writer)
letters-office = { path = "../../core/office" }
# the writer's second layout provider, letters' own (see src/writer/engine_layout.rs)
letters-layout = { path = "../../core/layout" }
# save to google drive (see src/drive): https with rustls, sha256 and random
# numbers for pkce, and the system credential store for the sign-in.
# all MIT or Apache-2.0
ureq = { version = "3", default-features = false, features = ["rustls"] }
sha2 = "0.11"
getrandom = "0.4"
keyring = { version = "3", features = ["windows-native", "apple-native"] }
# redaction, hidden information and passwords (see src/protect)
letters-redact = { path = "../../core/redact" }
# the font library (see src/fonts)
letters-fonts = { path = "../../core/fonts" }
# comparing two versions (see src/compare) and the accessibility checker
# (see src/a11y); png reads the engine's tiles and writes overlay pictures.
# MIT or Apache-2.0
letters-compare = { path = "../../core/compare" }
letters-a11y = { path = "../../core/a11y" }
png = "0.18"
# direct editing of page content (see src/edit) and text recognition (see
# src/ocr). ttf-parser checks an embedded font draws the text before the
# editor uses it; image holds a page drawn for recognition. MIT or Apache-2.0
letters-edit = { path = "../../core/edit" }
letters-ocr = { path = "../../core/ocr" }
ttf-parser = "0.25"
image = { version = "0.25", default-features = false }
# conversion and export (see src/export) and the optional ai tools (see
# src/ai). both this project's own crates
letters-convert = { path = "../../core/convert" }
letters-ai = { path = "../../core/ai" }
# the "exact match" word converter (see src/export/exact.rs)
letters-exact = { path = "../../core/exact" }
# search all documents and the page finder (see src/library_search and src/reading)
letters-search = { path = "../../core/search" }
# presentation mode: reads, edits, draws and writes .pptx and .odp (see src/slides)
letters-slides = { path = "../../core/slides" }
# the spreadsheet screen (see src/sheets): reading, calculating and writing workbooks
letters-sheets = { path = "../../core/sheets" }

[dev-dependencies]
# the annotation engine, run through an edit session in the tests
letters-annotate = { path = "../../core/annotate" }
# forms and signatures: signing and checking through an edit session in the tests
letters-forms = { path = "../../core/forms" }
png = "0.18"
# throwaway folders for the search and reading tests (MIT or Apache-2.0)
tempfile = "3"
