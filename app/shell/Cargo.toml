[package]
name = "letters-shell"
description = "the desktop shell: windows, file opening and the bridge between the ui and the pdf engine"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
# the shell has no unit tests of its own: everything testable lives in
# letters-shell-core, which can run without a window.
# the _lib suffix keeps the library name from clashing with the binary name on windows
name = "letters_shell_lib"
test = false
doctest = false

[[bin]]
name = "letters"
path = "src/main.rs"
test = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
letters-pdf = { path = "../../core/pdf" }
letters-pages = { path = "../../core/pages" }
letters-annotate = { path = "../../core/annotate" }
# forms and signatures (Fill & Sign)
letters-forms = { path = "../../core/forms" }
# redaction, hidden information and passwords (Protect)
letters-redact = { path = "../../core/redact" }
# the font library (fonts_commands.rs)
letters-fonts = { path = "../../core/fonts" }
# comparing two versions (compare_commands.rs) and the accessibility checker (a11y_commands.rs)
letters-compare = { path = "../../core/compare" }
letters-a11y = { path = "../../core/a11y" }
# editing page text and pictures (edit_commands.rs) and text recognition (ocr_commands.rs)
letters-edit = { path = "../../core/edit" }
letters-ocr = { path = "../../core/ocr" }
# conversion and export (export_commands.rs) and the optional ai tools (ai_commands.rs)
letters-convert = { path = "../../core/convert" }
letters-exact = { path = "../../core/exact" }
letters-ai = { path = "../../core/ai" }
letters-shell-core = { path = "../shell-core" }
# the document type every edit closure receives (mit licence)
lopdf = "0.47"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
