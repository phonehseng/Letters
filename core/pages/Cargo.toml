[package]
name = "letters-pages"
description = "reorders, rotates, inserts, deletes, extracts, merges, splits and crops pages, and stamps page numbers, headers, footers and watermarks"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
lopdf = "0.47"
png = "0.18"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
letters-pdf = { path = "../pdf" }
serde_json = "1"
