[package]
name = "letters-annotate"
description = "adds highlights, notes, text boxes, shapes and freehand ink to pages"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
lopdf = "0.47"
png = "0.18"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
letters-pdf = { path = "../pdf" }
png = "0.18"
serde_json = "1"
