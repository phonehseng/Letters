[package]
name = "letters-office"
description = "reads and writes word processor documents (docx and odt) through one shared model"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2"
# only deflate is needed: docx and odt packages use stored or deflated entries.
# zlib-rs is pure rust, so no c compiler is involved
zip = { version = "9.5.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
serde_json = "1.0.154"
