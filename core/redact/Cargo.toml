[package]
name = "letters-redact"
description = "removes content for good, scrubs hidden data, and locks files with a password"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# every dependency is MIT or Apache-2.0 licensed (or both)
lopdf = "0.47"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
flate2 = "1"
jpeg-decoder = { version = "0.3", default-features = false }
regex = "1"
getrandom = "0.4"

[dev-dependencies]
letters-pdf = { path = "../pdf" }
png = "0.18"
jpeg-encoder = "0.6"
serde_json = "1"
