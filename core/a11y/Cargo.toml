[package]
name = "letters-a11y"
description = "checks a pdf for accessibility problems and fixes them"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
lopdf = "0.47"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
letters-pdf = { path = "../pdf" }
png = "0.18"
serde_json = "1"
