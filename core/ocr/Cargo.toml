[package]
name = "letters-ocr"
description = "turns scans and photos into searchable text, fully offline"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

# every dependency is MIT or Apache-2.0 licensed (or both). the recognition
# engine itself (tesseract, apache-2.0) runs as a separate program fetched
# by tools/fetch-tesseract; see README.md for it and its libraries.
[dependencies]
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff"] }
lopdf = "0.47"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
letters-pdf = { path = "../pdf" }
png = "0.18"
serde_json = "1"
