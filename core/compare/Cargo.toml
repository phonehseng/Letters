[package]
name = "letters-compare"
description = "compares two versions of a document and reports what changed in text, formatting and layout"
version.workspace = true
edition.workspace = true
publish.workspace = true

# every dependency is MIT or Apache-2.0 (or both). see README.md for the list.
[dependencies]
lopdf = "0.47"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
letters-pdf = { path = "../pdf" }
png = "0.18"
serde_json = "1"
