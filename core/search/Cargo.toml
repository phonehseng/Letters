[package]
name = "letters-search"
description = "indexes every document the user chooses and searches them all at once, down to the page"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
thiserror = "2"
# word documents are read through the shared office model (this project's own crate)
letters-office = { path = "../office" }
# the catalog of indexed documents is stored as json inside the index file. MIT or Apache-2.0
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# folding "é" to "e" so searches ignore accents. MIT or Apache-2.0
unicode-normalization = "0.1"
# the quick content check that tells a changed file from a touched one. MIT or Apache-2.0
crc32fast = "1.5"

# macos only: asks a volume whether it tells upper and lower case apart,
# so paths on it are compared the way the file system compares them.
# MIT or Apache-2.0
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[dev-dependencies]
# a throwaway folder per test. MIT or Apache-2.0
tempfile = "3"
